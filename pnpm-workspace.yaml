nodeLinker: hoisted
shamefullyHoist: true
ignoreScripts: false
minimumReleaseAgeStrict: true
savePrefix: ''
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  node-pty: true
  unrs-resolver: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
